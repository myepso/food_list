<script>
'use strict';
const DATA=JSON.parse(document.getElementById('menu-data').textContent);
const WEEKS=[2,9,16,23,30],DAY_NAMES=['월','화','수','목','금'],MEALS=['조식','중식','석식'];
const $=id=>document.getElementById(id);
const koreaNow=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateFor(w,j){const d=new Date(Date.UTC(2026,10,WEEKS[w]+j));return {key:d.toISOString().slice(0,10),month:d.getUTCMonth()+1,date:d.getUTCDate()};}
function locate(key){for(let w=0;w<5;w++)for(let j=0;j<5;j++)if(dateFor(w,j).key===key)return [w,j];return null;}
let [week,day]=locate(koreaNow)||[0,0];
$('week').innerHTML=WEEKS.map((v,i)=>{const a=dateFor(i,0),b=dateFor(i,4);return `<option value="${i}">11월 ${i+1}주 · ${a.month}/${a.date} - ${b.month}/${b.date}</option>`;}).join('');
function mealCard(date,meal,k){const m=DATA[date.key]?.[meal];if(!m)return `<section class="meal empty"><h4>${meal}</h4><div class="empty-text"><div>${date.month!==11?'12월 식단 별도':'미기재'}<span>${date.month!==11?'11월 식단만 제공됩니다.':'원본에 식단 정보가 없습니다.'}</span></div></div></section>`;
 const n=m.nutrition.map(escapeHTML);return `<section class="meal ${['breakfast','lunch','dinner'][k]}"><h4>${meal}</h4><ul class="menu">${m.items.map(x=>`<li>${escapeHTML(x.name)}${x.allergens?`<span class="allergen" aria-label="알레르기 번호 ${escapeHTML(x.allergens)}">(${escapeHTML(x.allergens)})</span>`:''}</li>`).join('')}</ul><div class="nutrition"><strong>${n[0]} kcal</strong> · 단백질 ${n[1]} g<span class="more">칼슘 ${n[2]} mg · 철 ${n[3]} mg</span></div></section>`;}
function render(){const a=dateFor(week,0),b=dateFor(week,4);$('week').value=week;$('prev').disabled=week===0;$('next').disabled=week===4;$('range').textContent=`${a.month}월 ${a.date}일 - ${b.month}월 ${b.date}일`;
 $('days').innerHTML=DAY_NAMES.map((name,j)=>{const d=dateFor(week,j);return `<button data-day="${j}" aria-pressed="${j===day}" aria-label="${d.month}월 ${d.date}일 ${name}요일" class="${d.key===koreaNow?'is-today':''}">${name}<strong>${d.date}</strong></button>`;}).join('');
 $('grid').innerHTML=DAY_NAMES.map((name,j)=>{const d=dateFor(week,j);return `<article class="day ${j===day?'selected':''}" aria-label="${d.month}월 ${d.date}일 ${name}요일"><header class="day-head"><h3>${name}요일${d.key===koreaNow?'<span class="today-tag">오늘</span>':''}</h3><span class="date-number">${d.month}/${d.date}</span></header>${MEALS.map((m,k)=>mealCard(d,m,k)).join('')}</article>`;}).join('');
}
function changeWeek(w){week=w;day=0;$('status').textContent='';render();}
$('prev').onclick=()=>{if(week>0)changeWeek(week-1);};$('next').onclick=()=>{if(week<4)changeWeek(week+1);};$('week').onchange=e=>changeWeek(Number(e.target.value));
$('days').onclick=e=>{const b=e.target.closest('button[data-day]');if(!b)return;day=Number(b.dataset.day);render();$('days').querySelector(`[data-day="${day}"]`).focus();};
$('allergens').onchange=e=>document.body.classList.toggle('show-allergens',e.target.checked);
$('today').onclick=()=>{const pos=locate(koreaNow);if(pos){[week,day]=pos;render();$('status').textContent='오늘 식단을 선택했습니다.';}else $('status').textContent='오늘은 이 식단표의 제공 날짜가 아닙니다. 2026년 11월 평일을 선택해 주세요.';};
$('print').onclick=()=>window.print();
const ALLERGENS=['난류','우유','메밀','땅콩','대두','밀','고등어','게','새우','돼지고기','복숭아','토마토','아황산류','호두','닭고기','쇠고기','오징어','조개류(굴·전복·홍합 포함)','잣'];
$('legend').innerHTML=ALLERGENS.map((name,i)=>`<span><b>${i+1}</b>${name}</span>`).join('');render();
</script></body></html>
